[project]
name = "la-live"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gtfs-realtime-bindings>=3.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "shapely>=2.2.0",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poller"]
