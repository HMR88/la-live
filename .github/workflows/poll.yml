# Unattended la-live: every 5 minutes (the cron minimum; GitHub delays it under load) run the poller for
# 3.5 minutes at 30-second cycles, hand history to the next run through the Actions cache, and publish the
# viewer, the snapshots and the base tiles to GitHub Pages. Design and measurements: docs/log/step8.md.
# The base layers come from the orphan branch `data` (prep/data_branch.py). No secrets, no Valhalla, no cameras.
name: poll

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: poll
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: basedata
      - run: mkdir -p data && mv basedata/data/base data/base && ls -l data/base
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --no-dev
      - name: Restore history from the previous run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: history
          key: history-${{ github.run_id }}
          restore-keys: |
            history-
      - name: Poll for 3.5 minutes
        run: uv run --no-dev python -m poller run --minutes 3.5 --interval 30 --source github-actions --cadence 300 --retain-days 3
      - name: Save history for the next run
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: history
          key: history-${{ github.run_id }}
      - name: Assemble the site
        run: uv run --no-dev python prep/publish.py --out site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: poll
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
