# Unattended la-live, step 9 shape: one long job runs the poller for 340 minutes at 30-second cycles and a
# publisher next to it force-pushes the snapshot files every 5 minutes to the orphan branch `live`, which the
# viewer reads from raw.githubusercontent.com. History crosses runs through the Actions cache. At the end the
# job starts the next run itself (workflow_dispatch with the job's own token is one of the two GITHUB_TOKEN
# events that create runs); the cron is the restart after a failure or a cancel, delayed as GitHub delays it.
# Base layers come from the orphan branch `data`. Pages is deployed by pages.yml, not here.
# Design and measurements: docs/log/step9.md.
name: poll

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # force-push the live branch with the checkout's token
  actions: write    # start the next run

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: poll
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: basedata
      - run: mkdir -p data && mv basedata/data/base data/base && ls -l data/base
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --no-dev
      - name: Restore history from the previous run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: history
          key: history-${{ github.run_id }}
          restore-keys: |
            history-
      - name: Can this runner reach the feeds?
        run: |
          for url in https://cleverapi.bigbluebus.com/gtfsrt/vehicles https://nextccbus.org/gtfsrt/vehicles https://ladotbus.com/gtfs-rt/vehiclepositions https://cwwp2.dot.ca.gov/data/d7/atms/webupdate.txt; do
            curl -s -o /dev/null -w "$url -> HTTP %{http_code} in %{time_total}s\n" --max-time 10 "$url" || echo "$url -> no answer within 10 s"
          done
      - name: Poll for 340 minutes, publishing the live branch every 5
        run: |
          uv run --no-dev python -m poller run --minutes 340 --interval 30 --source github-actions --cadence 300 --retain-days 3 &
          POLLER=$!
          uv run --no-dev python -m poller.publish_live --remote origin --branch live --every 300 --while-pid "$POLLER"
          wait "$POLLER"
      - name: Save history for the next run
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: history
          key: history-${{ github.run_id }}
      - name: Start the next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run poll.yml --ref main
