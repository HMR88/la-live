[project]
name = "la-live"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gtfs-realtime-bindings>=3.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pyogrio>=0.13.0",
    "pyproj>=3.8.0",
    "shapely>=2.2.0",
    "websockets>=17.4",
]

[project.optional-dependencies]
cameras = [
    "av>=15",
    "imageio-ffmpeg>=0.6",
    "lap>=0.5.12",
    "ultralytics>=8.3",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# The repository root on sys.path: uv 0.13 flags the whole .venv hidden on macOS and CPython 3.13.18 skips
# hidden .pth files, so the editable install is not reliable. See docs/log/step7.md section 7.
pythonpath = ["."]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "poller"
module-root = ""
